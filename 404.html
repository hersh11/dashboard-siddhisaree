<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Siddhi Sarees Order Analytics Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b8324a'/%3E%3Ctext x='32' y='45' font-size='36' font-family='Arial' font-weight='800' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1c1613;
        --muted: #746a5f;
        --surface: #faf5ec;
        --accent: #b8324a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f3ede3;
          --muted: #a89e91;
          --surface: #1a1512;
          --accent: #e0627a;
        }
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        background: var(--surface);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }

      p.code {
        margin: 0;
        color: var(--accent);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 72px;
        font-weight: 700;
        line-height: 1;
      }

      h1 {
        margin: 12px 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 28px;
      }

      p {
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 8px;
        padding: 12px 20px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p>There's nothing at this address. The dashboard is a single page.</p>
      <a id="home" href="/">Open the dashboard</a>
    </main>
    <script>
      // GitHub Pages project sites live under /<repo>/, not at the domain root.
      if (location.hostname.endsWith("github.io")) {
        document.getElementById("home").href = "/" + location.pathname.split("/")[1] + "/";
      }
    </script>
  </body>
</html>
